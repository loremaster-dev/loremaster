AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Loremaster sync service

Resources:
  ServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: loremaster-service
    Properties:
      CodeUri: ..
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      # A fixed name, so the function can invoke itself without a circular reference.
      FunctionName: !Sub "${AWS::StackName}-service"
      # Long enough to purge the largest account. API Gateway still ends a request at 30 s.
      Timeout: 300
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          DEVICES_TABLE: !Ref DevicesTable
          MEMORIES_TABLE: !Ref MemoriesTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt DevicesTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${DevicesTable.Arn}/index/by_user"
            - Effect: Allow
              Action:
                - dynamodb:BatchGetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:BatchWriteItem
              Resource: !GetAtt MemoriesTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${MemoriesTable.Arn}/index/*"
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-service"
      Events:
        Api:
          Type: HttpApi

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  DevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: token_hash
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: token_hash
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by_user
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MemoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: memory_id
          AttributeType: S
        - AttributeName: seq
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: memory_id
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: by_seq
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: seq
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  ApiUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
