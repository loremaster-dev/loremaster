[package]
name = "loremaster-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aws-config = "1.13.0"
aws-sdk-dynamodb = "1.137.0"
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
getrandom = "0.4.3"
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http", "tracing"] }
loremaster-core.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
